<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Адміністрування телефонів</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Список телефонів</h2>
    <a th:href="@{/phones/new}" class="btn btn-primary mb-3">Додати новий телефон</a>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Бренд</th>
            <th>Модель</th>
            <th>Ціна</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="phone : ${phones}">
            <td th:text="${phone.id}"></td>
            <td th:text="${phone.brand}"></td>
            <td th:text="${phone.model}"></td>
            <td th:text="${phone.price}"></td>
            <td>
                <a th:href="@{/phones/{id}/edit(id=${phone.id})}" class="btn btn-sm btn-warning">Редагувати</a>
                <a th:href="@{/phones/{id}/delete(id=${phone.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Ви впевнені?')">Видалити</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
