<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма телефону</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${phone.id == null ? 'Новий телефон' : 'Редагування телефону'}"></h2>

    <form th:action="@{/phones/save}" th:object="${phone}" method="post" class="mt-4" style="max-width: 500px;">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Бренд:</label>
            <input type="text" th:field="*{brand}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Модель:</label>
            <input type="text" th:field="*{model}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Ціна:</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">URL фотографії:</label>
            <input type="text" th:field="*{imageUrl}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-success">Зберегти</button>
        <a th:href="@{/phones}" class="btn btn-secondary">Скасувати</a>
    </form>
</div>
</body>
</html>
